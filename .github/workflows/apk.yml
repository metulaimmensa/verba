name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install
      - name: Test conjugation
        run: npm test
      - name: Add Android platform
        run: |
          npx cap add android
          python3 scripts/patch-android.py
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk verba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: verba-apk
          path: verba.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Verba (последняя сборка)
          body: Свежая сборка из main. Скачай verba.apk и установи поверх старой.
          files: verba.apk
          make_latest: true
